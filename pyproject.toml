[project]
name = "connect-to-server-mcp"
version = "0.1.0"
description = "MCP server that lets AI agents connect to and manage any remote server over SSH."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vladislav Stelmakh", email = "vladislav.stelmakh02@gmail.com" }]
keywords = ["mcp", "ssh", "devops", "ai", "model-context-protocol"]

dependencies = [
    "mcp[cli]>=2.1",
    "asyncssh>=2.14.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
]

[project.scripts]
connect-to-server-mcp = "connect_to_server_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/connect_to_server_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
