<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="connect-to-server-mcp — give your AI agent a safe shell on any server">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1020"/>
      <stop offset="55%" stop-color="#101a30"/>
      <stop offset="100%" stop-color="#0d1526"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7dd3fc" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="420" fill="url(#bg)"/>
  <rect width="1280" height="420" fill="url(#grid)"/>
  <ellipse cx="1010" cy="150" rx="420" ry="300" fill="url(#glow)"/>
  <rect width="1280" height="4" fill="url(#accent)"/>

  <!-- left column -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="118" font-size="19" font-weight="600" letter-spacing="3.5" fill="#5eead4">MODEL CONTEXT PROTOCOL SERVER</text>
    <text x="72" y="192" font-size="52" font-weight="700" fill="#f8fafc">connect-to-server-mcp</text>
    <text x="72" y="242" font-size="25" fill="#94a3b8">Give your AI agent a safe shell on any server.</text>

    <g font-size="17" fill="#cbd5e1">
      <circle cx="80" cy="292" r="4" fill="#5eead4"/>
      <text x="98" y="298">Any host, any auth — SSH keys, passwords, bastions</text>
      <circle cx="80" cy="326" r="4" fill="#60a5fa"/>
      <text x="98" y="332">Per-host policy: read-only by default, audited always</text>
      <circle cx="80" cy="360" r="4" fill="#a78bfa"/>
      <text x="98" y="366">Commands, files, logs, systemd, health snapshots</text>
    </g>
  </g>

  <!-- terminal -->
  <g transform="translate(724, 88)">
    <rect x="0" y="0" width="484" height="268" rx="12" fill="#070c18" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="484" height="36" rx="12" fill="#0f172a"/>
    <rect x="0" y="24" width="484" height="12" fill="#0f172a"/>
    <circle cx="22" cy="18" r="5.5" fill="#ef4444" fill-opacity="0.85"/>
    <circle cx="42" cy="18" r="5.5" fill="#f59e0b" fill-opacity="0.85"/>
    <circle cx="62" cy="18" r="5.5" fill="#22c55e" fill-opacity="0.85"/>
    <text x="242" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" fill="#64748b">claude</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
      <text x="22" y="76" fill="#5eead4">$ <tspan fill="#e2e8f0">npx connect-to-server-mcp install</tspan></text>
      <text x="22" y="102" fill="#22c55e">✓ <tspan fill="#94a3b8">claude-code · claude-desktop registered</tspan></text>

      <text x="22" y="142" fill="#60a5fa">&gt; <tspan fill="#e2e8f0">why is prod-web throwing 502s?</tspan></text>
      <text x="22" y="168" fill="#a78bfa">⚙ <tspan fill="#94a3b8">tail_log(prod-web, unit:nginx)</tspan></text>
      <text x="22" y="192" fill="#a78bfa">⚙ <tspan fill="#94a3b8">system_overview(prod-web)</tspan></text>
      <text x="22" y="222" fill="#e2e8f0">upstream app.service is down;</text>
      <text x="22" y="244" fill="#e2e8f0">disk at 97% — /var/log/app.log</text>
    </g>
  </g>

  <!-- footer strip -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#475569">
    <text x="72" y="404">npmjs.com/package/connect-to-server-mcp</text>
    <text x="1208" y="404" text-anchor="end">Python 3.10+ · MIT</text>
  </g>
</svg>
